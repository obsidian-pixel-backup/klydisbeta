    <text x="1358" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">NVML · VRAM-aware offload</text>
    <text x="1358" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">P-core affinity · live telemetry</text>
