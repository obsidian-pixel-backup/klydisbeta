    <text x="874" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">Anti-bot search &amp; crawl</text>
    <text x="874" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">Fast direct-HTTP fallback</text>
