    <text x="1116" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">20 accents × 3 backgrounds</text>
    <text x="1116" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">Hot-swapped at runtime</text>
