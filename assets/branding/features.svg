<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 330" width="1600" height="330" role="img" aria-label="Klydis capability highlights — speculative decoding, local RAG, skill library, stealth web tools, theme system, hardware awareness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001619"/>
      <stop offset="1" stop-color="#04232B"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E4A54" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="330" fill="url(#bg)"/>
  <rect width="1600" height="330" fill="url(#grid)"/>

  <text x="800" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#4E7A84" text-anchor="middle">ONE ENGINE · EVERYTHING YOU NEED</text>
  <rect x="740" y="58" width="120" height="2" rx="1" fill="#50E8F4"/>

  <!-- tile 1: speculative decoding -->
  <g>
    <rect x="30" y="84" width="236" height="196" rx="14" fill="#042029" stroke="#163E46" stroke-width="1"/>
    <circle cx="148" cy="138" r="30" fill="#0A2E37" stroke="#1E4A54" stroke-width="1"/>
    <path d="M 139 116 L 128 132 h 8 l -3 12 11 -14 h -8 z" fill="#50E8F4"/>
    <text x="148" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#EAF9FB" text-anchor="middle">Speculative Decoding</text>
    <text x="148" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">Draft models + zero-VRAM</text>
    <text x="148" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">N-gram prompt-lookup fallback</text>
  </g>

  <!-- tile 2: local RAG -->
  <g>
    <rect x="272" y="84" width="236" height="196" rx="14" fill="#042029" stroke="#163E46" stroke-width="1"/>
    <circle cx="390" cy="138" r="30" fill="#0A2E37" stroke="#1E4A54" stroke-width="1"/>
    <g stroke="#7BE39B" stroke-width="2" fill="none" stroke-linejoin="round">
