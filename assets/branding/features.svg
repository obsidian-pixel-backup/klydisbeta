  <!-- tile 6: hardware awareness -->
  <g>
    <rect x="1240" y="84" width="236" height="196" rx="14" fill="#042029" stroke="#163E46" stroke-width="1"/>
    <circle cx="1358" cy="138" r="30" fill="#0A2E37" stroke="#1E4A54" stroke-width="1"/>
    <g stroke="#7DD3FC" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="1352" y="124" width="12" height="12" rx="2"/>
      <path d="M 1356 120 v 4 M 1360 120 v 4 M 1356 140 v 4 M 1360 140 v 4"/>
      <path d="M 1348 128 h 4 M 1348 132 h 4 M 1368 128 h 4 M 1368 132 h 4"/>
