  <g>
    <rect x="998" y="84" width="236" height="196" rx="14" fill="#042029" stroke="#163E46" stroke-width="1"/>
    <circle cx="1116" cy="138" r="30" fill="#0A2E37" stroke="#1E4A54" stroke-width="1"/>
    <g stroke="#FF8FB3" stroke-width="2" fill="none">
