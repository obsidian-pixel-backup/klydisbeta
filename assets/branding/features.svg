    <text x="390" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#EAF9FB" text-anchor="middle">Local RAG</text>
    <text x="390" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">Hybrid dense + BM25</text>
    <text x="390" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8FB4BC" text-anchor="middle">Fully offline, on your files</text>
  </g>

  <!-- tile 3: skill library -->
  <g>
    <rect x="514" y="84" width="236" height="196" rx="14" fill="#042029" stroke="#163E46" stroke-width="1"/>
    <circle cx="632" cy="138" r="30" fill="#0A2E37" stroke="#1E4A54" stroke-width="1"/>
    <g stroke="#B18CFF" stroke-width="2" fill="none" stroke-linejoin="round">
